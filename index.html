<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário Educacional 2026 - CAED</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  body { transition: background-color 0.3s, color 0.3s; }
  .month-card { border-left: 6px solid; border-radius: 8px; padding: 15px; margin-bottom: 12px; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
  .month-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
  .edit-mode { border: 2px dashed #3b82f6; background: rgba(59,130,246,0.1); }
  .color-picker { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #374151; cursor:pointer; transition: transform 0.2s; margin-right: 6px;}
  .color-picker:hover { transform: scale(1.1); }
  #adminPanel { position: fixed; top:0; left:0; right:0; z-index:1000; background:#0f172a; color:#fff; display:none; padding:12px; box-shadow:0 6px 18px rgba(0,0,0,0.5); }
  .selected-month { outline: 3px dashed rgba(255,255,255,0.5); }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

<!-- LOGIN PANEL -->
<div id="loginPanel" class="flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-3xl font-bold mb-4">Acesse o Calendário</h1>
  <input id="userName" type="text" placeholder="Seu nome" class="text-black p-2 rounded-lg w-64 mb-2">
  <input id="userPassword" type="password" placeholder="Senha" class="text-black p-2 rounded-lg w-64 mb-4" style="display:none">
  <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-semibold">Entrar</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="space-y-2">
  <h2 class="font-bold text-xl">Painel do Administrador</h2>
  <div class="flex flex-wrap gap-2">
    <button onclick="toggleEditMode()" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1 rounded">Editar Mês</button>
    <button onclick="undoChange()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Undo</button>
    <button onclick="downloadCalendar()" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded">Exportar PNG</button>
    <button onclick="toggleTheme()" class="bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded">Tema Claro/Escuro</button>
  </div>
  <div class="flex items-center mt-2 gap-2">
    <label>Tamanho da Fonte:</label>
    <input type="range" min="12" max="30" value="16" id="fontSizeSlider">
  </div>
</div>

<!-- CALENDAR -->
<div id="calendarContainer" class="container mx-auto px-4 py-8 hidden">
  <!-- Meses vão ser gerados aqui pelo JS -->
</div>

<script>
const allowedUsers = { "Bianca Rufino": "1234", "Admin": "admin" };
const months = [
  {name:"Janeiro", color:"#f87171", events:["Campanha 1","Campanha 2"]},
  {name:"Fevereiro", color:"#fbbf24", events:["Campanha 3"]},
  {name:"Março", color:"#34d399", events:["Campanha 4"]},
  {name:"Abril", color:"#60a5fa", events:["Campanha 5"]},
  {name:"Maio", color:"#a78bfa", events:["Campanha 6"]},
  {name:"Junho", color:"#f472b6", events:["Campanha 7"]},
  {name:"Julho", color:"#facc15", events:["Campanha 8"]},
  {name:"Agosto", color:"#22d3ee", events:["Campanha 9"]},
  {name:"Setembro", color:"#fb923c", events:["Campanha 10"]},
  {name:"Outubro", color:"#818cf8", events:["Campanha 11"]},
  {name:"Novembro", color:"#34d399", events:["Campanha 12"]},
  {name:"Dezembro", color:"#f87171", events:["Campanha 13"]}
];

let editMode = false;
let history = [];

document.getElementById("loginBtn").addEventListener("click", () => {
  const name = document.getElementById("userName").value.trim();
  if(allowedUsers[name]){
    const pwdField = document.getElementById("userPassword");
    if(name === "Bianca Rufino"){ pwdField.style.display="block"; pwdField.focus(); return; }
    loginSuccess();
  } else if(document.getElementById("userPassword").value === allowedUsers[name]){
    loginSuccess();
  } else { alert("Usuário ou senha incorreta."); }
});

function loginSuccess(){
  document.getElementById("loginPanel").style.display="none";
  document.getElementById("calendarContainer").style.display="block";
  document.getElementById("adminPanel").style.display="block";
  generateCalendar();
}

function generateCalendar(){
  const container = document.getElementById("calendarContainer");
  container.innerHTML="";
  months.forEach((m,i)=>{
    const card = document.createElement("div");
    card.className = "month-card";
    card.style.borderColor = m.color;
    card.innerHTML = `<h3 class="font-bold text-lg">${m.name}</h3>
                      <ul>${m.events.map(e=>`<li>${e}</li>`).join("")}</ul>`;
    card.onclick = () => { if(editMode) editMonth(i, card) };
    container.appendChild(card);
  });
}

function toggleEditMode(){
  editMode = !editMode;
  document.querySelectorAll(".month-card").forEach(c=>c.classList.toggle("edit-mode", editMode));
}

function editMonth(index, card){
  const newName = prompt("Digite o novo nome do mês:", months[index].name);
  if(newName){ 
    history.push(JSON.parse(JSON.stringify(months)));
    months[index].name = newName;
    generateCalendar();
  }
}

function undoChange(){
  if(history.length>0){
    months.splice(0,months.length,...history.pop());
    generateCalendar();
  }
}

function toggleTheme(){
  document.body.classList.toggle("bg-gray-900");
  document.body.classList.toggle("bg-white");
  document.body.classList.toggle("text-white");
  document.body.classList.toggle("text-black");
}

document.getElementById("fontSizeSlider").addEventListener("input",(e)=>{
  document.querySelectorAll(".month-card").forEach(c=>{
    c.style.fontSize = e.target.value+"px";
  });
});

function downloadCalendar(){
  html2canvas(document.getElementById("calendarContainer")).then(canvas=>{
    const link = document.createElement("a");
    link.download = "calendario.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
